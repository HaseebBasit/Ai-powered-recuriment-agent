{% extends "base.html" %}

{% block title %}{{ action }} Job Opening - SmartHire{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="d-flex align-items-center mb-4">
                <a href="{{ url_for('recruiter.jobs_list') }}" class="btn btn-sm btn-light border me-3">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <div>
                    <h3 class="fw-bold mb-0" style="color: var(--sh-primary);">{{ action }} Job Opening</h3>
                    <p class="text-muted small mb-0">Define required competencies and experience for AI screening.</p>
                </div>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="title" class="form-label fw-semibold small">Job Title <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="title" name="title" value="{{ job.title if job else '' }}" placeholder="e.g. Senior Python / Flask Backend Engineer" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="department" class="form-label fw-semibold small">Department</label>
                                <input type="text" class="form-control" id="department" name="department" value="{{ job.department if job else 'Engineering' }}" placeholder="e.g. Engineering / Product">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="location" class="form-label fw-semibold small">Location</label>
                                <input type="text" class="form-control" id="location" name="location" value="{{ job.location if job else 'Remote / Hybrid' }}" placeholder="e.g. Remote / New York">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="employment_type" class="form-label fw-semibold small">Employment Type</label>
                                <select class="form-select" id="employment_type" name="employment_type">
                                    <option value="Full-time" {% if job and job.employment_type == 'Full-time' %}selected{% endif %}>Full-time</option>
                                    <option value="Part-time" {% if job and job.employment_type == 'Part-time' %}selected{% endif %}>Part-time</option>
                                    <option value="Internship" {% if job and job.employment_type == 'Internship' %}selected{% endif %}>Internship</option>
                                    <option value="Contract" {% if job and job.employment_type == 'Contract' %}selected{% endif %}>Contract</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="min_experience" class="form-label fw-semibold small">Minimum Experience (Years)</label>
                                <input type="number" class="form-control" id="min_experience" name="min_experience" min="0" max="25" value="{{ job.min_experience if job else 1 }}" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="required_skills" class="form-label fw-semibold small">
                                Required Skills <span class="text-danger">*</span>
                                <span class="text-muted fw-normal">(Comma-separated. SmartHire AI uses these to match and rank applicant resumes)</span>
                            </label>
                            <input type="text" class="form-control" id="required_skills" name="required_skills" value="{{ job.required_skills if job else '' }}" placeholder="e.g. Python, Flask, REST APIs, SQL, Docker, Git" required>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label fw-semibold small">Job Description &amp; Responsibilities <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="description" name="description" rows="6" placeholder="Describe the day-to-day responsibilities, qualifications, and role objectives..." required>{{ job.description if job else '' }}</textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label for="deadline" class="form-label fw-semibold small">Application Deadline (Optional)</label>
                                <input type="date" class="form-control" id="deadline" name="deadline" value="{{ job.deadline.strftime('%Y-%m-%d') if job and job.deadline else '' }}">
                            </div>
                            {% if job %}
                            <div class="col-md-6 mb-4">
                                <label for="status" class="form-label fw-semibold small">Status</label>
                                <select class="form-select" id="status" name="status">
                                    <option value="Open" {% if job.status == 'Open' %}selected{% endif %}>Open</option>
                                    <option value="Closed" {% if job.status == 'Closed' %}selected{% endif %}>Closed</option>
                                </select>
                            </div>
                            {% endif %}
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a href="{{ url_for('recruiter.jobs_list') }}" class="btn btn-light border">Cancel</a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-check2 me-1"></i> Save Job Posting
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
